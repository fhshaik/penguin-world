name: penguin-world

services:
  db:
    image: postgres:12.2-alpine
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - wand
    volumes:
      - ./houdini/houdini.sql:/docker-entrypoint-initdb.d/houdini.sql
      - penguin_data:/var/lib/postgresql/data
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/db.png
  redis:
    image: redis:5.0.9-alpine
    restart: unless-stopped
    networks:
      - wand
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/redis.png
  web:
    build: ./web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ECONOMY_PORT: ${ECONOMY_PORT:-3010}
    ports:
      - "127.0.0.1:${WEB_PORT}:80"
    networks:
      - wand
    links:
      - dash:dash
      - economy:economy
    volumes:
      - ./www:/usr/share/nginx/html
      - ./vanilla-media:/usr/share/nginx/vanilla
      - ./servers.xml:/t/servers.xml

      - ./templates/sites/vanilla.conf.template:/etc/nginx/conf.d/vanilla.conf.template
      - ./templates/vanilla-media/play/index.html.template:/t/vanilla/play/index.html.template
      - ./templates/vanilla-media/play/es/index.html.template:/t/vanilla/play/es/index.html.template
      - ./templates/vanilla-media/play/fr/index.html.template:/t/vanilla/play/fr/index.html.template
      - ./templates/vanilla-media/play/pt/index.html.template:/t/vanilla/play/pt/index.html.template
      - ./templates/vanilla-media/media/play/web_service/environment_data.xml.template:/t/vanilla/media/play/web_service/environment_data.xml.template
    command: ["dockerize",
              "-template", "/etc/nginx/conf.d/vanilla.conf.template:/etc/nginx/conf.d/vanilla.conf",
              "-template", "/t/servers.xml:/usr/share/nginx/vanilla/play/servers.xml",
              "-template", "/t/vanilla/play/index.html.template:/usr/share/nginx/vanilla/play/index.html",
              "-template", "/t/vanilla/play/index.html.template:/usr/share/nginx/vanilla/play/en/index.html",
              "-template", "/t/vanilla/media/play/web_service/environment_data.xml.template:/usr/share/nginx/vanilla/media/play/web_service/environment_data.xml",
              "nginx", "-g", "daemon off;"]
    labels:
      net.unraid.docker.webui: http://[IP]:[PORT:${WEB_PORT}]
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/houdini.png
  economy:
    build: ./dash
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ECONOMY_PORT: ${ECONOMY_PORT:-3010}
      ECONOMY_AUTH_KEY: ${ECONOMY_AUTH_KEY:-houdini}
      POSTGRES_HOST: db
    networks:
      - wand
    volumes:
      - ./economy:/usr/src/economy:ro
    depends_on:
      - db
    entrypoint: ["dockerize", "-wait", "tcp://db:5432", "python", "/usr/src/economy/app.py"]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/db.png
  houdini_login:
    build: ./houdini
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - wand
    ports:
      - "127.0.0.1:${GAME_LOGIN_PORT}:${GAME_LOGIN_PORT}"
    volumes:
      - ./houdini:/usr/src/houdini
      - ./tools:/usr/src/houdini/local-tools:ro
      - ./wait-for-postgres.sh:/usr/src/houdini/wait-for-postgres.sh
    depends_on:
      - db
      - redis
    links:
      - db:db
      - redis:redis
    entrypoint: ["dockerize", "-wait", "tcp://redis:6379", "./wait-for-postgres.sh", "db", "python", "bootstrap.py", "login"]
    command: ["--port", "${GAME_LOGIN_PORT}",
              "--redis-address", "redis", 
              "--database-address", "db", 
              "--database-user", "${POSTGRES_USER}", 
              "--database-name", "${POSTGRES_USER}", 
              "--database-password", "${POSTGRES_PASSWORD}"]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/houdini.png
  houdini_blizzard:
    build: ./houdini
    restart: unless-stopped
    networks:
      - wand
    ports:
      - "127.0.0.1:19875:19875"
    volumes:
      - ./houdini:/usr/src/houdini
    depends_on:
      - houdini_login
    links:
      - db:db
      - redis:redis
      - houdini_login:login
    entrypoint: ["dockerize", "-wait", "tcp://login:${GAME_LOGIN_PORT}", "python", "bootstrap.py", "world"]
    command: ["-id", "3100", "--name", "blizzard", "--port", "19875", "--lang", "en",
              "--redis-address", "redis",
              "--database-address", "db",
              "--database-user", "${POSTGRES_USER}", 
              "--database-name", "${POSTGRES_USER}", 
              "--database-password", "${POSTGRES_PASSWORD}"]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/houdini.png
  trade_bot:
    profiles: ["testing"]
    build: ./houdini
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GAME_LOGIN_HOST: houdini_login
      GAME_WORLD_HOST: houdini_blizzard
      GAME_WORLD_PORT: 19875
    networks:
      - wand
    volumes:
      - ./houdini:/usr/src/houdini
      - ./tools:/usr/src/houdini/local-tools:ro
      - ./local-accounts:/local-accounts:ro
    depends_on:
      - houdini_login
      - houdini_blizzard
    entrypoint: ["dockerize", "-wait", "tcp://houdini_login:${GAME_LOGIN_PORT}", "-wait", "tcp://houdini_blizzard:19875",
                 "python", "local-tools/trade-test-bot.py", "/local-accounts/TradeTest.json"]
  houdini_glaciar:
    build: ./houdini
    restart: unless-stopped
    networks:
      - wand
    ports:
      - "127.0.0.1:9876:9876"
    volumes:
      - ./houdini:/usr/src/houdini
    depends_on:
      - houdini_login
    links:
      - db:db
      - redis:redis
      - houdini_login:login
    entrypoint: ["dockerize", "-wait", "tcp://login:${GAME_LOGIN_PORT}", "python", "bootstrap.py", "world"]
    command: ["-id", "3101", "--name", "glaciar", "--port", "9876", "--lang", "es",
              "--redis-address", "redis",
              "--database-address", "db",
              "--database-user", "${POSTGRES_USER}", 
              "--database-name", "${POSTGRES_USER}", 
              "--database-password", "${POSTGRES_PASSWORD}"]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/houdini.png
  houdini_avalanche:
    build: ./houdini
    restart: unless-stopped
    networks:
      - wand
    ports:
      - "127.0.0.1:9877:9877"
    volumes:
      - ./houdini:/usr/src/houdini
    depends_on:
      - houdini_login
    links:
      - db:db
      - redis:redis
      - houdini_login:login
    entrypoint: ["dockerize", "-wait", "tcp://login:${GAME_LOGIN_PORT}", "python", "bootstrap.py", "world"]
    command: ["-id", "3102", "--name", "avalanche", "--port", "9877", "--lang", "pt",
              "--redis-address", "redis",
              "--database-address", "db",
              "--database-user", "${POSTGRES_USER}", 
              "--database-name", "${POSTGRES_USER}", 
              "--database-password", "${POSTGRES_PASSWORD}"]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/houdini.png
  houdini_yeti:
    build: ./houdini
    restart: unless-stopped
    networks:
      - wand
    ports:
      - "127.0.0.1:9878:9878"
    volumes:
      - ./houdini:/usr/src/houdini
    depends_on:
      - houdini_login
    links:
      - db:db
      - redis:redis
      - houdini_login:login
    entrypoint: ["dockerize", "-wait", "tcp://login:${GAME_LOGIN_PORT}", "python", "bootstrap.py", "world"]
    command: ["-id", "3103", "--name", "yeti", "--port", "9878", "--lang", "fr",
              "--redis-address", "redis",
              "--database-address", "db",
              "--database-user", "${POSTGRES_USER}", 
              "--database-name", "${POSTGRES_USER}", 
              "--database-password", "${POSTGRES_PASSWORD}"]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/houdini.png
  dash:
    build: ./dash
    restart: unless-stopped
    networks:
      - wand
    env_file:
      - .env
    volumes:
      - ./dash:/usr/src/dash
      - ./vanilla-media/media/avatar/paper:/usr/src/dash/items
      - ./templates/dash/config.py.template:/usr/src/dash/config.py.template
    depends_on:
      - db
      - redis
    links:
      - db:db
      - redis:redis
      - houdini_login:login
    entrypoint: ["dockerize", "-wait", "tcp://login:${GAME_LOGIN_PORT}",
                "-template", "/usr/src/dash/config.py.template:/usr/src/dash/config.py",
                "python", "bootstrap.py"]
    command: ["-c", "config.py"]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/dash.png
  snowflake:
    build: ./snowflake
    restart: unless-stopped
    networks:
      - wand
    ports:
      - "127.0.0.1:${SNOWFLAKE_PORT}:${SNOWFLAKE_PORT}"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - MEDIA_LOCATION=${WEB_VANILLA_MEDIA}
      - PORT=${SNOWFLAKE_PORT}
    volumes:
      - ./snowflake:/usr/src/snowflake
      - ./.env:/usr/src/snowflake/.env
    depends_on:
      - db
      - redis
      - dash
    links:
      - db:db
      - redis:redis
      - houdini_login:login
    entrypoint: ["dockerize", "-wait", "tcp://login:${GAME_LOGIN_PORT}", "python", "./main.py"]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/snowflake.png

networks:
  wand:
    driver: bridge

volumes:
  penguin_data:
